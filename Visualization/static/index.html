<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse spatial viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="row">
      <strong>Warehouse viewer</strong>
      <span id="base" class="dim"></span>
      <span id="schema" class="dim"></span>
    </div>
    <div class="row" id="filters"></div>
    <div class="row">
      <label class="filter"><span>Base arm</span><select id="run-base"></select></label>
      <label class="filter"><span>Comparison arm (colour authority)</span>
        <select id="run-compare"></select></label>
      <label class="filter"><span>Colour</span>
        <select id="colorMode">
          <option value="home">final home</option>
          <option value="fill">fill</option>
          <option value="picks">pick activity</option>
        </select></label>
    </div>
    <nav id="tabs"></nav>
    <div class="row controls">
      <label>batch <input type="range" id="batch" min="0" max="0" value="0"></label>
      <label>time <input type="range" id="time" min="0" max="100" value="0"></label>
      <span id="status" class="dim"></span>
    </div>
    <div id="notice" class="notice"></div>
  </header>
  <main><canvas id="canvas"></canvas></main>
  <script type="module" src="main.js"></script>
</body>
</html>
