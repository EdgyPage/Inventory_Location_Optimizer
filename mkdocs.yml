site_name: Inventory Location Optimizer — Results
site_description: Simulation results and analysis for warehouse SKU placement strategies.
site_url: https://edgypage.github.io/Inventory_Location_Optimizer/
repo_url: https://github.com/EdgyPage/Inventory_Location_Optimizer
repo_name: EdgyPage/Inventory_Location_Optimizer

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js                          # arithmatex/MathJax config (typeset equations)
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - macros:
      module_name: docs/macros   # docs/macros.py; injects run params/formulas from committed JSON
  - glightbox        # zoom result images on click

markdown_extensions:
  - attr_list        # image sizing/attributes: ![](img.png){ width=600 }
  - md_in_html
  - tables
  - admonition       # note/warning callouts
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details   # collapsible ??? blocks (per-config figure groups)
  - pymdownx.arithmatex:
      generic: true    # typeset $…$ / $$…$$ math via MathJax

# Kept in the repo but excluded from the built site (maintainer / dev reference).
exclude_docs: |
  authoring.md
  example-run.md
  site-usage.md
  gpu_assessment.md
  gpu_auction_assessment.md
  # engineering design docs (repo reference, not site pages)
  design/
  # new-experiment scaffold + data/scripts that aren't pages
  experiments/_template/
  experiments/*/experiment.yml
  experiments/ingest.py

nav:
  - Home: index.md
  - Code map: code-graph.md
  - Future experiment discussion: future-experiments.md
  - Experiment 4:
      - Overview: experiments/experiment-4/index.md
      - Simulation lifecycle: experiments/experiment-4/comparison-overview.md
      - Formula reference: experiments/experiment-4/formula-reference.md
      - Comparison: experiments/experiment-4/comparison.md
      - Full results: experiments/experiment-4/full-results.md
      - Inventory distributions: experiments/experiment-4/inventory.md
      - Glossary: experiments/experiment-4/glossary.md
  - Experiment 3:
      - Overview: experiments/experiment-3/index.md
      - Simulation lifecycle: experiments/experiment-3/comparison-overview.md
      - Formula reference: experiments/experiment-3/formula-reference.md
      - Comparison: experiments/experiment-3/comparison.md
      - Full results: experiments/experiment-3/full-results.md
      - Inventory distributions: experiments/experiment-3/inventory.md
      - Glossary: experiments/experiment-3/glossary.md
  - Experiment 2:
      - Overview: experiments/experiment-2/index.md
      - Simulation lifecycle: experiments/experiment-2/comparison-overview.md
      - Inventory baselines: experiments/experiment-2/inventory.md
      - Formula reference: experiments/experiment-2/formula-reference.md
      - Highlights: experiments/experiment-2/highlights.md
      - Everything else: experiments/experiment-2/everything-else.md
      - Glossary: experiments/experiment-2/glossary.md
  - Experiment 1:
      - Overview: experiments/experiment-1/index.md
      - Simulation lifecycle: experiments/experiment-1/comparison-overview.md
      - Inventory distributions: experiments/experiment-1/inventory.md
      - Formula reference: experiments/experiment-1/formula-reference.md
      - 'Comparison — 2026-06-24': experiments/experiment-1/comparison-20260624.md
