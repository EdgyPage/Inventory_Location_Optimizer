# architecture.yml — curated design INTENT for the warehouse simulator.
#
# The DERIVED truth is context/arch/graph.json (regenerated from source by
# context/arch/extract.py).  This file asserts CLAIMS against that graph, checked by
# context/arch/verify_architecture.py (gated in the suite by Tests/architecture/test_architecture_sync.py):
#   - SCOPE    (intent ⊆ reality): every `backbone` edge below must exist in graph.json.
#   - BOUNDARY (reality ⊆ policy): no import edge in graph.json may cross a `forbid` pair.
#   - anchors: every {name,file,kind} here is checked to exist by verify_context.check_symbol.
# Anchors are exact code identifiers (never paraphrased); NO line numbers anywhere.
version: 1

# --- Layers: every source file maps to exactly one layer (longest `match` wins; explicit
#     `members` override; `except` carves sub-trees out).  Used for BOUNDARY + the catalog.
layers:
  - {name: leaf,           members: [Warehouse/physical.py]}          # dependency-free primitive
  # --- Warehouse domain packages (longest match wins, so these beat "Warehouse/") -----------
  - {name: wh_kernel,      match: "Warehouse/kernel/"}                # zero-dependency value objects
  - {name: wh_layout,      match: "Warehouse/layout/"}                # physical geometry
  - {name: wh_catalog,     match: "Warehouse/catalog/"}               # SKUs + demand
  - {name: wh_inventory,   match: "Warehouse/inventory/"}             # the placement engine
  - {name: wh_placement,   match: "Warehouse/placement/"}             # the assignment functions
  - {name: wh_picking,     match: "Warehouse/picking/"}               # the pick simulations
  - {name: wh_operations,  match: "Warehouse/operations/"}            # roles/modes/workers/crews
  - {name: warehouse_core, match: "Warehouse/",
     except: ["Warehouse/generation/", "Warehouse/physical.py"]}      # the domain engine
  - {name: generation,     match: "Warehouse/generation/"}            # data-gen CLIs
  # --- Optimization run-harness packages ---------------------------------------------------
  - {name: opt_config,      match: "Optimization/config/"}            # CONFIG + the sweeps
  - {name: opt_persistence, match: "Optimization/persistence/"}       # SQLite read/write
  - {name: opt_metrics,     match: "Optimization/metrics/"}           # events -> numbers
  - {name: opt_runschema,   match: "Optimization/runschema/"}         # the run-tree contract
  - {name: opt_simdriver,   match: "Optimization/simdriver/"}         # orchestration
  - {name: optimization,   match: "Optimization/",
     except: ["Optimization/Performance_Evaluations/", "Optimization/gpu/"]}   # run harness
  - {name: evaluations,    match: "Optimization/Performance_Evaluations/"}     # analysis/plots
  - {name: gpu,            match: "Optimization/gpu/"}                # optional GPU accelerators
  - {name: diagnostics,    match: "Diagnostics/"}
  - {name: visualization,  match: "Visualization/"}
  - {name: schema,         match: "Schema/"}                          # stdlib-only DB-shape leaf
  - {name: scripts,        match: "scripts/"}
  - {name: docs,           match: "docs/"}
  - {name: tests,          match: "Tests/"}                           # catalog-only (not in the graph)

# --- Boundaries: import invariants the domain must uphold.  Each is currently satisfied
#     (verified against graph.json); a new import that violates one fails the suite.
boundaries:
  - {forbid: [warehouse_core, optimization], why: "domain engine must not import the run harness"}
  - {forbid: [warehouse_core, evaluations],  why: "domain engine must not import analysis/plotting"}
  - {forbid: [warehouse_core, generation],   why: "domain engine must not depend on data-gen CLIs"}
  - {forbid: [warehouse_core, diagnostics],  why: "domain engine must not import diagnostics"}
  - {forbid: [warehouse_core, visualization],why: "domain engine must not import the viewer"}
  - {forbid: [warehouse_core, gpu],          why: "core stays CPU-only; GPU is an optional add-on"}
  - {forbid: [leaf, "*"],                    why: "physical.py is a dependency-free leaf"}

  # --- Package-level invariants: what keeps the 2026-07 restructure from re-sprawling.
  #     Each was checked against graph.json BEFORE being asserted (a forbid that is already
  #     violated fails immediately), so none of these is aspirational.
  - {forbid: [wh_kernel, "*"],               why: "kernel is zero-dependency: cost_model/regime are imported by everything and may import nothing"}
  - {forbid: [wh_layout, wh_inventory],      why: "geometry is a primitive; the placement engine builds on it, not the reverse"}
  - {forbid: [wh_layout, wh_placement],      why: "geometry must not know which assignment function chose a bin"}
  - {forbid: [wh_layout, wh_picking],        why: "geometry must not depend on the pick simulation"}
  - {forbid: [wh_catalog, wh_inventory],     why: "what a SKU IS must not depend on where it is placed"}
  - {forbid: [wh_catalog, wh_placement],     why: "the catalogue must not depend on the assignment functions"}
  # The `warehouse_core -> optimization` forbid above is nearly VACUOUS: every domain subtree
  # has a longer `match`, so `warehouse_core` selects little more than Warehouse/__init__.py
  # and the three packages that actually hold the engine were never fenced.  These three name
  # them.  Asserted only after confirming the graph already satisfies each (no domain module
  # imports Optimization today), which is what makes adding them free rather than aspirational.
  - {forbid: [wh_picking, optimization],     why: "the pick simulation must not import the run harness — it is handed a PickConfig, never CONFIG"}
  - {forbid: [wh_inventory, optimization],   why: "the placement engine must not import the run harness; a worker builds it from picklable values"}
  - {forbid: [wh_placement, optimization],   why: "an assignment function must not import the run harness — it is a closure over its own inputs"}
  # wh_operations is the actor model (who does the work) plus the OPERATIONS themselves
  # (putaway.put_cost, inbound.receive).  It may import wh_kernel and the VALUE layers
  # (wh_layout, wh_catalog) — an operation on merchandise has to know what a pallet and an
  # Order are — but not the MACHINERY that consumes those values: not the pick simulation,
  # not the placement engine, not the assignment functions, and never the run harness.  So
  # a future Warehouse/inbound/ can build a crew of unloaders without inverting a
  # dependency, and the pick simulation depends on this package rather than the reverse.
  #
  # An earlier version of this comment said "wh_kernel and NOTHING else in the domain",
  # which four `forbid` rules never enforced and `inbound.py` already contradicted by
  # importing `Warehouse.layout.Storage_Primitive`.  The four rules below are the real
  # contract; the prose now describes them instead of a stricter one nobody checked.
  - {forbid: [wh_operations, optimization], why: "a crew is built from picklable values handed to a worker, never from CONFIG"}
  - {forbid: [wh_operations, wh_picking],   why: "who does the work must not depend on the pick simulation — the second stream is not a picker"}
  - {forbid: [wh_operations, wh_inventory], why: "an actor must not depend on the placement engine"}
  - {forbid: [wh_operations, wh_placement], why: "an actor must not depend on the assignment functions"}
  - {forbid: [opt_persistence, opt_config],  why: "persistence is a leaf: a worker saves results without dragging CONFIG into its process"}
  - {forbid: [opt_persistence, opt_simdriver], why: "storing results must not depend on orchestration"}
  - {forbid: [opt_persistence, opt_runschema], why: "DB IO must not depend on run-tree path resolution"}
  - {forbid: [opt_persistence, opt_metrics], why: "persistence stores numbers; it must not compute them"}
  - {forbid: [opt_metrics, opt_simdriver],   why: "metrics are computed from events, independent of who ran them"}
  - {forbid: [opt_metrics, opt_config],      why: "metrics must not depend on the run's tuning knobs"}

  # --- Schema/ is the stdlib-only DB-shape leaf, importable by every layer.  NOT expressed as
  #     `[schema, "*"]` like wh_kernel: the wildcard matches schema itself, and identity.py
  #     legitimately imports its own siblings.  These name the layers it must never reach —
  #     a DB-shape module that imported a writer would be a cycle waiting to happen.
  - {forbid: [schema, warehouse_core],       why: "shape identity must not depend on the domain engine"}
  - {forbid: [schema, generation],           why: "shape identity must not depend on the data-gen CLIs"}
  - {forbid: [schema, optimization],         why: "shape identity must not depend on the run harness"}
  - {forbid: [schema, opt_persistence],      why: "Schema describes the DDL; it must not import it"}
  - {forbid: [schema, evaluations],          why: "shape identity must not depend on analysis"}
  - {forbid: [schema, visualization],        why: "shape identity must not depend on the viewer"}
  - {forbid: [schema, diagnostics],          why: "shape identity must not depend on diagnostics"}

# --- Backbone: the caller->callee edges that define the system's call structure.  SCOPE
#     asserts each exists in graph.json (via = edge kind: calls | ref | dispatch).
#     `coverage: static-only` marks edges the empirical coverage test must NOT expect to run
#     (e.g. the ProcessPool spawn, which coverage_e2e bypasses by design).
backbone:
  # simulation entry -> scenario -> shared assets -> warehouse sizing
  - {src: {name: _run_scenario, file: Optimization/simdriver/scenario.py, kind: function},
     dst: {name: build_shared_assets, file: Optimization/simdriver/sim_assets.py, kind: function}, via: calls}
  - {src: {name: build_shared_assets, file: Optimization/simdriver/sim_assets.py, kind: function},
     dst: {name: plan_warehouse, file: Warehouse/inventory/inventory_planning.py, kind: function}, via: calls}
  # scenario -> supervisor -> build units -> per-channel prep -> batches
  - {src: {name: _run_scenario, file: Optimization/simdriver/scenario.py, kind: function},
     dst: {name: _run_workers_flat, file: Optimization/simdriver/supervisor.py, kind: function}, via: calls}
  - {src: {name: _run_workers_flat, file: Optimization/simdriver/supervisor.py, kind: function},
     dst: {name: _supervise, file: Optimization/simdriver/supervisor.py, kind: function}, via: calls}
  - {src: {name: _supervise, file: Optimization/simdriver/supervisor.py, kind: function},
     dst: {name: _build_work_units, file: Optimization/simdriver/workunits.py, kind: function}, via: calls}
  - {src: {name: _build_work_units, file: Optimization/simdriver/workunits.py, kind: function},
     dst: {name: _prepare_channel_run, file: Optimization/simdriver/workunits.py, kind: function}, via: calls}
  - {src: {name: _prepare_channel_run, file: Optimization/simdriver/workunits.py, kind: function},
     dst: {name: ensure_batches, file: Optimization/simdriver/batch_precompute.py, kind: function}, via: calls}
  # supervisor -> pool -> spawn boundary (worker passed as a value; never coverage-measured)
  - {src: {name: _supervise, file: Optimization/simdriver/supervisor.py, kind: function},
     dst: {name: _run_pool, file: Optimization/simdriver/supervisor.py, kind: function}, via: calls}
  - {src: {name: _run_pool, file: Optimization/simdriver/supervisor.py, kind: function},
     dst: {name: _run_strategy_worker, file: Optimization/simdriver/strategy_runner.py, kind: function},
     via: ref, coverage: static-only}
  # worker body -> batch load + pick simulation (wrapper delegates to the impl)
  - {src: {name: _run_strategy_worker_impl, file: Optimization/simdriver/strategy_runner.py, kind: function},
     dst: {name: load_batches, file: Optimization/simdriver/batch_precompute.py, kind: function}, via: calls}
  - {src: {name: _run_strategy_worker_impl, file: Optimization/simdriver/strategy_runner.py, kind: function},
     dst: {name: DeferredPickSimulation, file: Warehouse/picking/fast_pick.py, kind: class}, via: calls}
  # placement dispatch (the closures behind mgr.placement) — supplied by resolver_hints.yml
  - {src: {name: _stock_per_unit, file: Warehouse/inventory/Inventory_Management.py, kind: function},
     dst: {name: place_one, file: Warehouse/placement/Assignment_Functions.py, kind: function}, via: dispatch}
  - {src: {name: _stock_ranked, file: Warehouse/inventory/Inventory_Management.py, kind: function},
     dst: {name: place_wave, file: Warehouse/placement/Assignment_Functions.py, kind: function}, via: dispatch}
  # capacity-reloader registry membership
  - {src: {name: RELOADERS, file: Warehouse/placement/Capacity_Reloader.py, kind: const},
     dst: {name: rebalance_reloader, file: Warehouse/placement/Capacity_Reloader.py, kind: function}, via: ref}
  # what-if matrix reuses the scenario runner per cell
  - {src: {name: main, file: Optimization/run_simulation.py, kind: function},
     dst: {name: _run_whatif_matrix, file: Optimization/simdriver/scenario.py, kind: function}, via: calls}
  - {src: {name: _run_whatif_matrix, file: Optimization/simdriver/scenario.py, kind: function},
     dst: {name: _run_scenario, file: Optimization/simdriver/scenario.py, kind: function}, via: calls}
  # sim entry -> post-sim analysis hub (in-process, unless --no-analyze)
  - {src: {name: main, file: Optimization/run_simulation.py, kind: function},
     dst: {name: analyze_run, file: Optimization/analyze_run.py, kind: function}, via: calls}
  # analysis pipeline
  - {src: {name: main, file: Optimization/run_analysis.py, kind: function},
     dst: {name: run_analysis, file: Optimization/run_analysis.py, kind: function}, via: calls}
  - {src: {name: run_analysis, file: Optimization/run_analysis.py, kind: function},
     dst: {name: _config_jobs, file: Optimization/run_analysis.py, kind: function}, via: calls}
  - {src: {name: run_analysis, file: Optimization/run_analysis.py, kind: function},
     dst: {name: _aggregate_jobs, file: Optimization/run_analysis.py, kind: function}, via: calls}

# --- Hotpaths: functions asserted to actually EXECUTE under the in-process end-to-end
#     driver (Tests/bench/coverage_e2e.py :: main).  Checked empirically by
#     Tests/architecture/test_architecture_coverage.py.  The first is the sentinel (called directly by
#     the driver) so a no-op driver fails loudly rather than passing vacuously.
hotpaths:
  - {name: _run_strategy_worker, file: Optimization/simdriver/strategy_runner.py, kind: function}  # sentinel
  - {name: build_shared_assets,  file: Optimization/simdriver/sim_assets.py, kind: function}
  - {name: _prepare_channel_run, file: Optimization/simdriver/workunits.py, kind: function}
  - {name: _finalize_config_run, file: Optimization/simdriver/supervisor.py, kind: function}
  - {name: plan_warehouse,       file: Warehouse/inventory/inventory_planning.py, kind: function}
  - {name: ensure_batches,       file: Optimization/simdriver/batch_precompute.py, kind: function}
  - {name: run_analysis,         file: Optimization/run_analysis.py, kind: function}
