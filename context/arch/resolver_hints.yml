# resolver_hints.yml — the ONE dynamic-dispatch layer static AST cannot see.
#
# Every OTHER dynamic layer in this repo resolves statically in extract.py:
#   - mixin methods (Inventory_Manager bases)      -> MRO pass (calls edges)
#   - string registries (RELOADERS/STRATEGIES/...) -> `ref` edges (function-as-value)
#   - ProcessPool submit(_run_strategy_worker)     -> `ref` edge (function-as-argument)
#
# Only the placement closures are invisible: a strategy stores an anonymous closure on
# `mgr.placement.place_one` / `.place_wave` (a Placement value object), so the callee name
# never appears at the dispatch site.  The manager's drain methods below invoke those
# closures; the closures are the nested `place_one`/`place_wave` defs built by the
# `build_*` factories in Assignment_Functions.py.  Each anchor is {name, file} — the
# extractor resolves it to every real node with that name in that file (verified: an
# unresolved anchor is reported by --write and fails verify_architecture).
version: 1
dispatch:
  - src: {name: _stock_per_unit, file: Warehouse/inventory/Inventory_Management.py}   # Inventory_Manager._stock_per_unit -> self.placement.place_one(...)
    dst: {name: place_one,        file: Warehouse/placement/Assignment_Functions.py}
  - src: {name: _stock_ranked,   file: Warehouse/inventory/Inventory_Management.py}    # Inventory_Manager._stock_ranked -> self.placement.place_wave(...)
    dst: {name: place_wave,       file: Warehouse/placement/Assignment_Functions.py}
  # THE LIVE PATH, and it was undeclared until 2026-09-16.  `_stock_ranked` branches on
  # `placement.is_pooled`: 14 of the 17 shipped restock rules take the POOLED branch above,
  # and only the `place_wave` branch below it was declared -- so the generated code map showed
  # the legacy wave as the placement path and the pool as unreachable.  `take` resolves to
  # every `_Pool` subclass's method of that name (7 today).
  - src: {name: _stock_ranked,   file: Warehouse/inventory/Inventory_Management.py}    # -> self.placement.open_pool(...)
    dst: {name: open_pool,        file: Warehouse/placement/Assignment_Functions.py}
  - src: {name: _stock_ranked,   file: Warehouse/inventory/Inventory_Management.py}    # -> pool.take(unit)
    dst: {name: take,             file: Warehouse/placement/Assignment_Functions.py}
