  "Inbound/receiving.py":
    purpose: "the site's receiving coordinator: one dock, one yard, N leaves."
    layer: "inbound"
    key_symbols:
      - {name: "SiteReceiving", file: "Inbound/receiving.py", kind: "class"}
    notes: "Owns the standing drain, which used to be the manager's `_receive_standing`. Reaches each channel's leaf through three public ports (`plan_lot`, `accept`, `owned_skus`) and never imports one: `Warehouse <-> Inbound` is forbidden both ways, so the driver binds it (`mgr.receiving`). That is what lets one dock serve two leaves: `bind` builds the `{sku: leaf}` owner dict that routes a bare lot at step 1 while `regime_of(item.unit)` routes the unit at step 4, `SITE_PHASES` composes the same seven reorder phases with the lead tick and the receive site-scoped, and the site `recv_clock` is one carry based at the site day start. Refuses a non-standing transit at construction."
  "Inbound/site_space.py":
    purpose: "Composes the leaves' frozen space views into the ONE view a drain reads: `empties` filtered per contributing leaf so the key set is partitioned by regime, `predicted` and `emptied_at` unioned, versions element-wise, `released_at` per regime, the futuresight window refused."
    layer: "inbound"
