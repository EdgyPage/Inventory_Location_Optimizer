# context/flows/simulation.yml — verifiable spec of the simulation flow.
# Every functions[] entry is an ANCHOR: verify_context.py asserts `def NAME`/`class NAME`
# exists in FILE.  reads/writes reference artifact ids in ../artifacts.yml; guards are
# test files that lock the step.  Machine-parsable by downstream design programs.
version: 1
flow: simulation
summary: >
  End-to-end strategy comparison. Discover inventory+affinity DB pairs, build shared
  per-pair assets (sized warehouse + planned inventory), fan the (pair x config x
  channel x strategy) work units across a spawn-mode process pool, persist per-strategy
  SQLite result DBs under comparison_<ts>/<pair>/<config>[/<channel>]/, and finalize
  per-channel-run sim_meta.json manifests. Store and fulfillment are INDEPENDENT
  channels (a union of runs, not a cross product), combined only post-analysis.
entry:
  command: "python Optimization/run_simulation.py [--workers N] [--resume DIR] [--n-batches N]"
  file: Optimization/run_simulation.py
  function: main

steps:
  - id: load_config
    summary: >
      All tunables live in the nested CONFIG dict (global + per-channel sections) with
      the STORE_CONFIGS/FULFILLMENT_CONFIGS pick-time sweeps; CLI flags override.
    functions:
      - {name: CONFIG, file: Optimization/sim_config.py, kind: const}
      - {name: STORE_CONFIGS, file: Optimization/sim_config.py, kind: const}
      - {name: FULFILLMENT_CONFIGS, file: Optimization/sim_config.py, kind: const}
      - {name: regime_sizing_from_config, file: Optimization/sim_config.py, kind: function}
      - {name: _build_pick_cfg, file: Optimization/sim_config.py, kind: function}
    reads: []
    writes: []
    guards: [Tests/test_channel_runner_smoke.py, Tests/test_regime_sizing.py]
    next: [discover_pairs]

  - id: discover_pairs
    summary: >
      Scan the profiles tree for (label, inventory.db, affinity.db) pairs; default is
      the newest generated profile run only.
    functions:
      - {name: discover_db_pairs, file: Optimization/runlayout.py, kind: function}
      - {name: find_latest_db_pairs, file: Optimization/runlayout.py, kind: function}
      - {name: _write_run_spec, file: Optimization/sim_manifest.py, kind: function}
      - {name: _load_run_spec, file: Optimization/sim_manifest.py, kind: function}
      - {name: _apply_run_spec, file: Optimization/run_simulation.py, kind: function}
    reads: [inventory_db, affinity_db]
    writes: [run_manifest, run_spec]
    guards: [Tests/test_batch_precompute_e2e.py, Tests/test_run_spec_roundtrip.py]
    next: [build_shared_assets]

  - id: build_shared_assets
    summary: >
      Per pair: load the catalog, size the warehouse (plan_warehouse with per-regime
      sizing from CONFIG), persist the planned inventory + warehouse stats (rename-proof
      fingerprint), and return the picklable shared dict every worker receives.
    functions:
      - {name: build_shared_assets, file: Optimization/sim_assets.py, kind: function}
      - {name: plan_warehouse, file: Warehouse/inventory_planning.py, kind: function}
      - {name: compute_warehouse_fingerprint, file: Optimization/Warehouse_Data.py, kind: function}
    reads: [inventory_db, affinity_db]
    writes: [warehouse_db, planned_inventory_db]
    guards: [Tests/test_warehouse_sizing.py, Tests/test_regime_sizing.py]
    next: [prepare_channel_runs]

  - id: prepare_channel_runs
    summary: >
      Plan the independent per-channel sweep (store configs + fulfillment configs when
      the catalog is mixed); per channel-run: build the PickConfig, write config.json,
      precompute the channel's batch stream, create per-strategy run DBs, save resume
      state, and emit the strategy work units.
    functions:
      - {name: _channel_runs_for, file: Optimization/simdriver/workunits.py, kind: function}
      - {name: _prepare_channel_run, file: Optimization/simdriver/workunits.py, kind: function}
      - {name: _plan_strategy_start, file: Optimization/simdriver/workunits.py, kind: function}
      - {name: make_channel, file: Optimization/channels.py, kind: function}
      - {name: ensure_batches, file: Optimization/batch_precompute.py, kind: function}
      - {name: batch_fingerprint, file: Optimization/batch_precompute.py, kind: function}
      - {name: create_run, file: Optimization/Picking_Data.py, kind: function}
      - {name: _save_resume, file: Optimization/sim_manifest.py, kind: function}
    reads: [planned_inventory_db, affinity_db]
    writes: [config_json, batches_cache, resume_pkl, sim_db]
    guards: [Tests/test_channel_runner_smoke.py, Tests/test_channel_strategy_subset.py, Tests/test_batch_precompute.py]
    next: [run_workers]

  - id: run_workers
    summary: >
      One flat spawn-mode ProcessPoolExecutor over every (pair, config, channel, strategy)
      unit, wrapped by a crash-recovery supervisor: a hard worker death that breaks the pool
      triggers a rebuild + resubmit of the unfinished units (each resuming from its on-disk
      checkpoint) up to --max-retries, then quarantines any still-failing unit. Each worker
      loads the planned inventory (regime-filtered), rebuilds the warehouse, stocks it via its
      strategy, then runs the batch loop (reorders -> pick simulation -> stats -> checkpointed
      saves).
    functions:
      - {name: _run_workers_flat, file: Optimization/simdriver/supervisor.py, kind: function}
      - {name: _supervise, file: Optimization/simdriver/supervisor.py, kind: function}
      - {name: _build_work_units, file: Optimization/simdriver/workunits.py, kind: function}
      - {name: _run_pool, file: Optimization/simdriver/supervisor.py, kind: function}
      - {name: _run_strategy_worker, file: Optimization/strategy_runner.py, kind: function}
      - {name: DeferredPickSimulation, file: Warehouse/fast_pick.py, kind: class}
      - {name: per_pick, file: Warehouse/cost_model.py, kind: function}
      - {name: load_batches, file: Optimization/batch_precompute.py, kind: function}
    reads: [planned_inventory_db, affinity_db, batches_cache]
    writes: [sim_db, keyframes_db, checkpoint_pkl]
    guards: [Tests/test_index_equivalence.py, Tests/test_rng_determinism.py, Tests/test_batch_precompute_e2e.py, Tests/test_crash_recovery.py]
    next: [finalize]

  - id: finalize
    summary: >
      When a channel-run's strategies all complete: remove resume state, clean
      checkpoints, write/merge sim_meta.json; then scan every sim DB and warn loudly
      about blank arms (zero recorded batches).
    functions:
      - {name: _finalize_config_run, file: Optimization/simdriver/supervisor.py, kind: function}
      - {name: _warn_blank_arms, file: Optimization/simdriver/scenario.py, kind: function}
      - {name: iter_sim_dbs, file: Optimization/runlayout.py, kind: function}
      - {name: write_run_manifest, file: Optimization/sim_manifest.py, kind: function}
    reads: [sim_db]
    writes: [sim_meta]
    guards: [Tests/test_channel_runner_smoke.py]
    next: []
