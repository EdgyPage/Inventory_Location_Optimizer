<header class="topbar">

<main>
<div class="explorer">
  <aside id="ego-tree" class="tree" aria-label="code tree"></aside>
  <div class="ego-main">
    <nav id="ego-crumbs" class="crumbs"></nav>
    <div id="ego" class="ego-stage" data-focus=""></div>
  </div>

    <input id="ego-search" class="filter" placeholder="search…" autocomplete="off">
    <ul id="ego-results"></ul>
    <div id="ego-detail"><p class="ego-hint">Search, pick a node in the tree, or click a graph node to explore its callers &amp; callees. The tree and breadcrumb show where you are.</p></div>
  </aside>
</div>
<script src="assets/graph.js"></script>
<script src="assets/ego_svg.js"></script>
<script>/* cytoscape is optional; loaded only if vendored */</script>
